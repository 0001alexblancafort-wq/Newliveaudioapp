name: Build Android (Nuevo)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: write

    steps:
      # La solución definitiva al error 128 (confiar en todas las carpetas)
      - name: Arreglar error de Git (128)
        run: git config --global --add safe.directory '*'

      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Aceptar licencias de Android
        run: yes | sdkmanager --licenses || true

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            cmake;3.22.1

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ¡¡MUY IMPORTANTE!! Como tu proyecto está en la carpeta "Main", hay que entrar ahí con "cd Main"
      - name: Compilar el proyecto
        run: cd Main && ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --console=plain
