name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Usamos * (comodín) o $GITHUB_WORKSPACE para decirle a Git que confíe en la carpeta
      - name: Arreglar error de Git (128)
        run: git config --global --add safe.directory '*'

      - name: Checkout del repositorio
        uses: actions/checkout@v5

      # Las licencias deben aceptarse antes de instalar nada
      - name: Aceptar licencias de Android
        run: yes | sdkmanager --licenses || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            cmake;3.22.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --console=plain
